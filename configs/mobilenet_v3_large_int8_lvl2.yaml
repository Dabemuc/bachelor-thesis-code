# P11 + Kern-Konfiguration MobileNetV3-Large (torchvision IMAGENET1K_V1), INT8, DFC-Stufe 2
# ⚠️ Hard-Swish ist im DFC 3.33.1 nur „preview“ (Doku Translating TF/ONNX, S. 10).
# Im Compile-Log prüfen: Anzahl Kontexte (Single Context?), TSE/SE-Umbau, Warnungen zu Hard-Swish.
#
# Aus thesis-onnx-nodes (torchvision MobileNetV3-Large IMAGENET1K_V1, TorchScript-Exporter,
# opset 13, Mac), 20.10.2026:
#   /features/features.16/features.16.2/Mul → Ausgang von features[16] (Conv 1×1 + Hard-Swish,
#     exportiert als HardSigmoid + Mul) = letzte Conv-Stufe vor dem AvgPool, 7×7×960 → Eigen-CAM.
#     Entspricht dem Forward-Hook auf model.features in reference/fp32_run.py.
#   /classifier/classifier.3/Gemm → Logits (1000; ONNX-Ausgang „logits“).
# Bei anderem torch-/Exporter-Stand können sich die Namen ändern → neu nachsehen.
name: mobilenet_v3_large_int8_lvl2
model: mobilenet_v3_large
precision: int8
subset: imagenet_eval_48000.txt
calib_subset: imagenet_calib_2000_seed1.txt
calib_size: 1024
onnx: onnx/mobilenet_v3_large.onnx
hef: mobilenet_v3_large_int8_lvl2/mobilenet_v3_large.hef
end_node_names:
  - "/features/features.16/features.16.2/Mul"
  - "/classifier/classifier.3/Gemm"
normalize_on_chip: true
optimization_level: 2
warmup_iters: 50
repeats: 3
save_features: true
notes: "Phase 1: P11 (läuft MobileNetV3 durch die Kette?)"
