# Erstes Experiment (AP0): ResNet18, INT8, Hailo-8
name: resnet18_int8
model: resnet18
precision: int8
subset: val_1000_seed0.txt        # data/subsets/ – für ALLE Läufe identisch
onnx: onnx/resnet18.onnx
hef: resnet18_int8/resnet18.hef   # wird von thesis-compile erzeugt

# Mit `thesis-onnx-nodes artifacts/onnx/resnet18.onnx` die echten Namen nachsehen!
# Erwartet: letztes ReLU in layer4 (Feature-Map 7×7×512) + Gemm (Logits).
end_node_names:
  - "TODO_layer4_last_relu"
  - "TODO_fc_gemm"

normalize_on_chip: true           # Host füttert uint8; mean/std liegen im HEF
calib_size: 1024
warmup_iters: 50
repeats: 3                        # Hailo ist lauf-zu-lauf nicht deterministisch
save_features: true
notes: ""
