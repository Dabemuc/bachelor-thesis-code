# Phase 1 / Kern-Konfiguration ResNet18: INT8, DFC-Stufe 2 explizit (Entscheidung E-A 20.10.2026)
# Kalibrierung + Finetune aus abgetrenntem Val-Teil (Entscheidung 19.10.2026), Eval disjunkt.
# P2 (Determinismus Chip): thesis-edge-run configs/resnet18_int8_lvl2.yaml --limit 200  (repeats: 3)
name: resnet18_int8_lvl2
model: resnet18
precision: int8
subset: imagenet_eval_48000.txt
calib_subset: imagenet_calib_2000_seed1.txt
calib_size: 1024                  # = Finetune-Default (dataset_size) und Mindestmenge für Stufe 2 (Doku MO S. 7); DFC kalibriert mit den ersten 64. Mehr bringt numerisch nichts, kostet aber RAM (float32: 1024 ≈ 0,6 GB)
onnx: onnx/resnet18.onnx
hef: resnet18_int8_lvl2/resnet18.hef
end_node_names:                   # wie resnet18_int8.yaml (AP0, 23.09.2026)
  - "/layer4/layer4.1/relu_1/Relu"
  - "/fc/Gemm"
normalize_on_chip: true
optimization_level: 2
warmup_iters: 50
repeats: 3
save_features: true
notes: "Phase 1: P2 (repeats=3) und Referenz für P3"
